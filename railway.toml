# Railway deployment config for capture-mcp-server.
# Builds the root Dockerfile. The same settings are declared in .railway/railway.ts (Railway stops
# reading this file on 2026-12-01); keep the two in step until this file is deleted.
# Auth: set MCP_REQUIRE_OAUTH=true, OAUTH_TOKEN_SECRET and MCP_PUBLIC_BASE_URL; HTTP mode refuses to start without auth.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
