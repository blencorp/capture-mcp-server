# Railway deployment config for capture-mcp-server.
# Runs the server in HTTP mode (StreamableHTTP transport) on Railway-injected $PORT.
# Auth note: set MCP_REQUIRE_OAUTH=true for remote MCP connector auth.

[build]
# Railpack resolves the explicit Node 24 engine from package.json. The legacy
# Nixpacks Node provider does not list Node 24 as a supported major.
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
