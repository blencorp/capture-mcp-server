name: Deploy to Railway

# Break-glass/manual deployment of an explicitly selected Git ref. Normal
# production deploys run from the immutable tag created by release.yml, which
# prevents the pre-version-bump commit from racing the released artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or SHA to deploy
        required: true
        default: main

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    env:
      TEST_REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Pin tested commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install infrastructure dependencies
        run: npm ci --prefix infrastructure

      - name: Run test suite
        run: npm test

      - name: Run CDK assertions
        run: npm run cdk:test

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.43.1

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not configured. See README's Railway deploy section."
            exit 1
          fi
          railway up --service capture-mcp-server --ci

      - name: Read expected version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify deployed artifact and both protocol eras
        run: >-
          npm run verify:deployment --
          --base-url https://capture.mcp.blencorp.com
          --expected-version ${{ steps.version.outputs.value }}
