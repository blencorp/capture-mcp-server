name: Deploy to Railway

# Auto-deploys to Railway on push to main. Also runnable manually via the
# Actions tab. Requires a RAILWAY_TOKEN repository secret (Railway project
# token from https://railway.com/account/tokens).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not configured. See README's Railway deploy section."
            exit 1
          fi
          railway up --service capture-mcp-server --ci

      - name: Verify health
        run: |
          # Give Railway a moment to flip traffic to the new build.
          for i in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' https://capture.mcp.blencorp.com/health || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed (HTTP $status)"
              curl -sS https://capture.mcp.blencorp.com/health
              exit 0
            fi
            echo "Attempt $i: HTTP $status, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check did not succeed within 5 minutes"
          exit 1
