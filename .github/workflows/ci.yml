name: CI

on:
  # No push trigger: on main, release.yml runs these gates via workflow_call before it publishes.
  pull_request:
    branches: [main]
  # The release workflow runs these exact gates on the commit it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull-request runs are cancelled, never the gates of a release or deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      # The documentation site (site/) has its own lockfile; the Docker job builds it.
      - run: pnpm audit --audit-level moderate
        working-directory: site
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # `pnpm test` builds again, because the stdio and package specs run the compiled server.
      - run: pnpm test

  package:
    # The npm tarball and the Claude Desktop bundle, each run the way a user runs it: unpacked or
    # installed in a clean directory, minimal environment, no API keys, no repository node_modules.
    name: npm package + MCPB bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: npm package contents
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node -e "const f=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/pack.json'))[0].files.map(x=>x.path);for(const p of ['LICENSE','NOTICE','README.md','dist/server.js','dist/web/THIRD_PARTY_NOTICES.txt'])if(!f.includes(p)){console.error('missing '+p);process.exit(1)};if(f.some(p=>/^(\.env|\.local|src|test|mcpb-build|site|\.github)/.test(p))){console.error('unexpected files');process.exit(1)}"
      - name: npm package smoke (install the tarball in a clean directory)
        run: |
          mkdir "$RUNNER_TEMP/pkg" && cd "$RUNNER_TEMP/pkg" && npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/blen-capture-mcp-server-*.tgz
          node "$GITHUB_WORKSPACE/scripts/stdio-smoke.mjs" "$RUNNER_TEMP/pkg" node_modules/.bin/capture-mcp-server
          # HTTP from an unrelated directory, as npx starts it: the landing page, the policy pages and the assets ship in the package.
          mkdir "$RUNNER_TEMP/elsewhere"
          node "$GITHUB_WORKSPACE/scripts/http-smoke.mjs" "$RUNNER_TEMP/elsewhere" "$RUNNER_TEMP/pkg/node_modules/.bin/capture-mcp-server"
      - run: pnpm mcpb:prepare && pnpm mcpb:pack
      - name: MCPB smoke (unpack in a clean directory)
        run: |
          mkdir "$RUNNER_TEMP/mcpb" && cd "$RUNNER_TEMP/mcpb" && unzip -q "$GITHUB_WORKSPACE/capture-mcp-server.mcpb"
          test -f LICENSE && test -f NOTICE && test -f dist/web/THIRD_PARTY_NOTICES.txt
          node "$GITHUB_WORKSPACE/scripts/stdio-smoke.mjs" "$RUNNER_TEMP/mcpb" node dist/server.js
      # The manifest also admits Node 24 (the engines floor): run the same bundle there.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: MCPB smoke on Node 24
        run: node --version && node "$GITHUB_WORKSPACE/scripts/stdio-smoke.mjs" "$RUNNER_TEMP/mcpb" node dist/server.js

  accessibility:
    # The landing, policy and docs pages in a real browser: axe-core (WCAG 2.0-2.2 A/AA) light and
    # dark, 1280 and 320 px, plus landmark, focus and announcement checks (web/e2e). Manual checks
    # are in docs/accessibility.md.
    name: accessibility (landing + docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: site
      # The browser version is pinned by @playwright/test in the lockfile.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: capture-mcp-server:ci
      - name: Refuses to start without authentication
        run: |
          if docker run --rm capture-mcp-server:ci; then
            echo "the image started without authentication" >&2
            exit 1
          fi
      - name: Serves health and requires a bearer with OAuth configured
        run: |
          docker run -d --name capture -p 127.0.0.1:8080:8080 \
            -e MCP_REQUIRE_OAUTH=true \
            -e OAUTH_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e MCP_PUBLIC_BASE_URL=http://127.0.0.1:8080 \
            capture-mcp-server:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"authMode":"oauth"'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp -H 'content-type: application/json' -d '{}')
          test "$status" = 401
          # The landing page, the policy text and the docs are public.
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8080/privacy-policy | grep -q 'The server does not store your keys'
          curl -fsS http://127.0.0.1:8080/docs/ | grep -q 'Capture MCP'
          test "$(docker inspect --format '{{.Config.User}}' capture)" = node
          docker rm -f capture
