name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Other workflows (release, Railway deploy) run these exact gates on the commit they publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # `pnpm test` builds again, because the stdio and package specs run the compiled server.
      - run: pnpm test

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: capture-mcp-server:ci
      - name: Refuses to start without authentication
        run: |
          if docker run --rm capture-mcp-server:ci; then
            echo "the image started without authentication" >&2
            exit 1
          fi
      - name: Serves health and requires a bearer with OAuth configured
        run: |
          docker run -d --name capture -p 127.0.0.1:8080:8080 \
            -e MCP_REQUIRE_OAUTH=true \
            -e OAUTH_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e MCP_PUBLIC_BASE_URL=http://127.0.0.1:8080 \
            capture-mcp-server:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"authMode":"oauth"'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp -H 'content-type: application/json' -d '{}')
          test "$status" = 401
          test "$(docker inspect --format '{{.Config.User}}' capture)" = node
          docker rm -f capture
