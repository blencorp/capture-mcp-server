name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t capture-mcp-server:ci .

      - name: Refuse to start without auth
        run: |
          if docker run --rm capture-mcp-server:ci; then
            echo "the image started without authentication" >&2
            exit 1
          fi

      - name: Serve health and require a bearer with OAuth configured
        run: |
          docker run -d --name capture -p 127.0.0.1:8080:8080 \
            -e MCP_REQUIRE_OAUTH=true \
            -e OAUTH_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e MCP_PUBLIC_BASE_URL=http://127.0.0.1:8080 \
            capture-mcp-server:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"authMode":"oauth"'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp -H 'content-type: application/json' -d '{}')
          test "$status" = 401
          test "$(docker inspect --format '{{.Config.User}}' capture)" = node
          docker rm -f capture
