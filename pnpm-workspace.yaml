# Build scripts allowed to run during `pnpm install`: esbuild fetches its native binary.
allowBuilds:
  esbuild: true
# Patched versions of vulnerable transitive packages go under `overrides:` (pnpm audit), for
# example:
#   overrides:
#     some-package@<1.2.3: ^1.2.3 # parent -> GHSA-xxxx-xxxx-xxxx
# Remove an entry once its parent ships the fix. An advisory with no patched release goes under
# `auditConfig.ignoreGhsas`; each entry needs a row in EXCEPTIONS in a test,
# and the scheduled security workflow fails once the advisory is withdrawn or gets a fix.
#   auditConfig:
#     ignoreGhsas:
#       - GHSA-xxxx-xxxx-xxxx # package-name: why it is safe here

# Active overrides.
overrides:
  # @modelcontextprotocol/sdk 1.x accepts zod ^3.25 || ^4 and resolves 3.25.x, which is affected
  # by GHSA-mrhx-c7xc-m3w5 (unbounded memory validating oversized collections; fixed in 4.6.6).
  # zod 4 is within the SDK's declared range. Remove once the SDK's own range requires it.
  zod@<4.6.6: ^4.6.7
